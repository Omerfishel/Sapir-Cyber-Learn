name: Build security feed

# Aggregates the latest security posts into feed.json a few times a day.
# The app reads feed.json (same-origin) — no CORS, no third-party proxy.
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:          # run on demand from the Actions tab

permissions:
  contents: write             # needed to commit feed.json back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build feed.json
        run: node scripts/build-feed.mjs
      - name: Commit feed.json if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --staged --quiet || git commit -m "chore: update security feed [skip ci]"
          git push
