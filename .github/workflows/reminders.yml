name: Sapir roadmap reminders

# Fires even when nobody has the site open. Cron times are in UTC.
# Israel is UTC+3 (summer) / UTC+2 (winter) — shift the crons by 1h across DST if the exact minute matters.
#
# study-vs-reading is decided in the "Decide nudge type" step below, by matching the
# firing cron string. If you change a time, update BOTH the cron here AND its line in that step.
on:
  schedule:
    - cron: '30 17 * * *'    # reading nudge   (UTC 17:30 -> ~20:30 Israel summer / ~19:30 winter)
    - cron: '0 15 * * *'     # study nudge     (UTC 15:00 -> ~18:00 Israel summer / ~17:00 winter)
  workflow_dispatch:         # run by hand from the Actions tab
    inputs:
      type:
        description: 'which nudge to send (study or reading)'
        default: 'study'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decide nudge type
        run: |
          T="${{ github.event.inputs.type }}"
          if [ -z "$T" ]; then
            case "${{ github.event.schedule }}" in
              "0 15 * * *")  T=study   ;;   # <-- keep in sync with the study cron above
              "30 17 * * *") T=reading ;;   # <-- keep in sync with the reading cron above
              *)             T=reading ;;
            esac
          fi
          echo "DISPATCH_TYPE=$T" >> "$GITHUB_ENV"
          echo "Nudge type resolved to: $T"

      - name: Send reminder email
        env:
          EMAILJS_SERVICE_ID:  ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY:  ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          TO_EMAIL:            ${{ secrets.TO_EMAIL }}
          APP_URL:             ${{ secrets.APP_URL }}
        run: node scripts/reminder.mjs
