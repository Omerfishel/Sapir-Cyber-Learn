<!--
  Sapir Cyber Learn — EmailJS template.
  Paste this whole block into your EmailJS template's CONTENT editor
  (switch it to the "Code"/"</>" view first, then paste).
  All {{variables}} are filled by scripts/reminder.mjs. Set the template
  Subject field to:  {{subject}}   and the "To" field to:  {{to_email}}
-->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent">{{subline}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0f14;margin:0;padding:24px 12px">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;background:#121821;border:1px solid #223041;border-radius:18px;overflow:hidden">

        <!-- header -->
        <tr><td style="padding:22px 26px 6px 26px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
            <td style="font:700 14px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#e8eef5">
              <span style="font-size:18px">🐼</span>&nbsp; Sapir Cyber Learn
            </td>
            <td align="right">
              <span style="display:inline-block;font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;color:#4ade80;background:rgba(74,222,128,0.14);border:1px solid rgba(74,222,128,0.35);border-radius:20px;padding:5px 11px">{{kicker}}</span>
            </td>
          </tr></table>
        </td></tr>

        <!-- Bao mascot -->
        <tr><td style="padding:18px 26px 0 26px">
          <table role="presentation" cellpadding="0" cellspacing="0"><tr>
            <td style="width:64px;padding:0"><img src="{{mascot_url}}" width="64" height="64" alt="Bao the panda" style="display:block;width:64px;height:64px;border-radius:16px;border:1px solid rgba(74,222,128,0.35)"></td>
            <td style="padding-left:12px;vertical-align:middle">
              <div style="font:800 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.8px;color:#4ade80">BAO</div>
              <div style="font:400 12px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#9fb0c0;margin-top:2px">your panda study buddy</div>
            </td>
          </tr></table>
        </td></tr>

        <!-- headline + subline -->
        <tr><td style="padding:14px 26px 0 26px">
          <div style="font:800 26px/1.25 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#e8eef5;margin:0 0 10px">{{headline}}</div>
          <div style="font:400 15px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#9fb0c0">{{subline}}</div>
        </td></tr>

        <!-- CTA -->
        <tr><td style="padding:22px 26px 6px 26px">
          <a href="{{cta_url}}" target="_blank" style="display:inline-block;background:#4ade80;color:#06210f;font:800 15px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;text-decoration:none;padding:14px 28px;border-radius:12px">{{cta_text}}</a>
        </td></tr>

        <!-- streak bar -->
        <tr><td style="padding:14px 26px 4px 26px">
          <div style="background:#0e141c;border:1px solid #223041;border-radius:12px;padding:11px 14px;font:600 13px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#cdd9e5">{{streak_line}}</div>
        </td></tr>

        <!-- today's read card -->
        <tr><td style="padding:16px 26px 6px 26px">
          <div style="font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.5px;color:#6b7c8c;margin:0 0 8px">{{read_label}}</div>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0e141c;border:1px solid #223041;border-left:3px solid #4ade80;border-radius:12px">
            <tr><td style="padding:13px 15px">
              <a href="{{read_url}}" target="_blank" style="font:650 15px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#e8eef5;text-decoration:none">{{read_title}}</a>
              <div style="font:600 12px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#9fb0c0;margin-top:6px">{{read_source}} &nbsp;·&nbsp; <a href="{{read_url}}" target="_blank" style="color:#4ade80;text-decoration:none">Read ↗</a></div>
            </td></tr>
          </table>
        </td></tr>

        <!-- footer -->
        <tr><td style="padding:18px 26px 24px 26px">
          <div style="border-top:1px solid #223041;padding-top:14px">
            <div style="font:600 13px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#9fb0c0">{{sign}}</div>
            <div style="font:400 11px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#556575;margin-top:8px">
              Sent by your roadmap tracker · <a href="{{cta_url}}" target="_blank" style="color:#6b7c8c">open the app</a>
            </div>
          </div>
        </td></tr>

      </table>
    </td>
  </tr>
</table>
